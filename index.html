<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daisy Frost iPhone</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="iphone">


<div class="dynamic-island"></div>


<!-- LOCK SCREEN -->

<section id="lock">


<div class="lock-time" id="time">
00:00
</div>


<div class="lock-date" id="date">
Sunday, August 2
</div>


<div class="lock-owner">

<p>RECOVERED DEVICE</p>

<h3>
Daisy Frost's iPhone
</h3>

</div>



<div class="face-id" onclick="unlock()">

<div class="face-circle">
◉
</div>

<span>
Face ID
</span>

</div>


</section>




<!-- HOME SCREEN -->


<section id="home">


<div class="status-bar">

<span id="homeTime">
00:00
</span>


<div>
◔ ▮▮▮ 🔋
</div>


</div>



<div class="app-grid">


<div class="app">
<div class="icon photos">
📷
</div>
<span>
Photos
</span>
</div>



<div class="app">

<div class="icon message">
💬
</div>

<span>
Messages
</span>

</div>



<div class="app">

<div class="icon pin">
📌
</div>

<span>
Pinterest
</span>

</div>




<div class="app">

<div class="icon note">
📝
</div>

<span>
Notes
</span>

</div>



<div class="app">

<div class="icon music">
🎵
</div>

<span>
Spotify
</span>

</div>



<div class="app">

<div class="icon file">
📁
</div>

<span>
Files
</span>

</div>



</div>



<div class="dock">

<div>☎️</div>

<div>🌐</div>

<div>✉️</div>

</div>


</section>



</div>


<script src="script.js"></script>

</body>
</html>
