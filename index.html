<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 서사 보관소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iphone-container">
        <!-- 상단 노치 및 상태바 -->
        <div class="notch"></div>
        <div class="status-bar">
            <span id="clock" class="time">00:00</span>
            <span class="icons">📶 🔋</span>
        </div>
        
        <!-- 홈 화면 어플 목록 -->
        <div class="home-screen">
            <div class="app-grid">
                <!-- App 1: 프로필 -->
                <div class="app" data-title="프로필" data-content="이름: 000<br>나이: 00<br><br>이곳에 캐릭터의 기본 프로필과 특징을 HTML 태그와 함께 자유롭게 구성해보세요.">
                    <img src="https://picsum.photos/seed/char1/120/120" alt="App Icon">
                    <span>프로필</span>
                </div>
                
                <!-- App 2: 에피소드 1 -->
                <div class="app" data-title="첫 만남" data-content="어두운 골목길, 두 사람의 첫 만남에 대한 서사를 기록하는 공간입니다.<br><br>대화나 특정 사건을 적어내려가기 좋습니다.">
                    <img src="https://picsum.photos/seed/story1/120/120" alt="App Icon">
                    <span>에피소드 1</span>
                </div>
                
                <!-- App 3: 비밀 기록 -->
                <div class="app" data-title="비밀 기록" data-content="캐릭터의 속마음이나 타인에게는 말하지 못한 과거의 상처 등을 기록합니다.">
                    <img src="https://picsum.photos/seed/secret/120/120" alt="App Icon">
                    <span>비밀 기록</span>
                </div>
                
                <!-- App 4: 설정 -->
                <div class="app" data-title="세계관 설정" data-content="작품의 배경이 되는 세계관과 규칙을 설명하는 페이지입니다.">
                    <img src="https://picsum.photos/seed/setting/120/120" alt="App Icon">
                    <span>설정</span>
                </div>
            </div>
        </div>

        <!-- 어플 클릭 시 열리는 화면 -->
        <div class="app-screen" id="appModal">
            <div class="app-header">
                <button id="closeBtn">〈 뒤로</button>
                <h2 id="appTitle">제목</h2>
            </div>
            <div class="app-content" id="appContent">
                내용이 여기에 표시됩니다.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
