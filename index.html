<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovered iPhone</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="iphone">

    <div class="dynamic-island"></div>


    <!-- 잠금 화면 -->

    <section id="lockScreen">

        <div class="time">
            2:13
        </div>

        <div class="date">
            Sunday, August 2
        </div>


        <div class="owner">
            <p>RECOVERED DEVICE</p>
            <h2>Daisy Frost's iPhone</h2>
        </div>


        <div class="face">
            ◉
            <span>Face ID</span>
        </div>


    </section>



    <!-- 홈 화면 -->

    <section id="homeScreen">


        <div class="status">
            2:13
        </div>


        <div class="apps">


            <div class="app" onclick="openApp('photos')">
                📷
                <span>Photos</span>
            </div>


            <div class="app" onclick="openApp('messages')">
                💬
                <span>Messages</span>
            </div>


            <div class="app" onclick="openApp('notes')">
                📝
                <span>Notes</span>
            </div>



        </div>



        <div class="dock">

            ☎️
            ◉
            ✉️

        </div>


    </section>


</div>


<script src="script.js"></script>

</body>
</html>
