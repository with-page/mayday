<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daisy's iPhone</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="iphone">


<div class="dynamic-island"></div>


<!-- LOCK SCREEN -->

<section id="lockScreen">


<div class="lock-time" id="time">
00:00
</div>


<div class="lock-date" id="date">
Sunday, August 2
</div>



<div class="widget">

<p>☁️</p>
<span>72°F</span>

</div>



<div class="owner">

<p>RECOVERED DEVICE</p>

<h3>
Daisy Frost's iPhone
</h3>

</div>



<div class="faceID">

<div class="scan">
◉
</div>

<p>
Face ID
</p>

</div>



</section>





<!-- HOME SCREEN -->

<section id="homeScreen">


<div class="statusbar">

<span id="homeTime">
00:00
</span>

<div>
▮▮▮  ◉ 🔋
</div>

</div>




<div class="apps">


<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/1375/1375106.png">

<span>Photos</span>

</div>



<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">

<span>Messages</span>

</div>




<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">

<span>Pinterest</span>

</div>




<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/2919/2919592.png">

<span>Notes</span>

</div>



<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/3669/3669986.png">

<span>Spotify</span>

</div>



<div class="app">

<img src="https://cdn-icons-png.flaticon.com/512/716/716784.png">

<span>Files</span>

</div>



</div>




<div class="dock">

<img src="https://cdn-icons-png.flaticon.com/512/597/597177.png">

<img src="https://cdn-icons-png.flaticon.com/512/5968/5968841.png">

<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">

</div>



</section>


</div>


<script src="script.js"></script>

</html>
