<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 서사 보관소</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="iphone-container">
        <!-- 상단 노치 및 상태바 -->
        <div class="notch"></div>
        <div class="status-bar">
            <span id="clock" class="time">00:00</span>
            <span class="icons">📶 🔋</span>
        </div>
        
        <!-- 홈 화면 어플 목록 -->
        <div class="home-screen">
            <div class="app-grid">
                <!-- App 1: 데이지 기록 (일반 텍스트 앱) -->
                <div class="app" data-target="app-daisy">
                    <img src="https://picsum.photos/seed/daisy/120/120" alt="App Icon">
                    <span>데이지 기록</span>
                </div>
                
                <!-- App 2: 사진첩 (갤러리 앱) -->
                <div class="app" data-target="app-gallery">
                    <img src="https://picsum.photos/seed/photo/120/120" alt="App Icon">
                    <span>사진첩</span>
                </div>
            </div>
        </div>

        <!-- 📱 앱 화면 1: 데이지 기록 -->
        <div class="app-screen" id="app-daisy">
            <div class="app-header">
                <button class="close-btn">〈 뒤로</button>
                <h2>데이지 기록</h2>
            </div>
            <div class="app-content">
                데이지에 대한 최근 관찰 기록입니다.<br><br>
                현재까지는 일상적인 동선 외에 특별한 감정선이나 연애 기류는 발견되지 않았습니다. 추후 행적을 계속 업데이트할 예정입니다.
            </div>
        </div>

        <!-- 📱 앱 화면 2: 사진첩 (갤러리 형태) -->
        <div class="app-screen" id="app-gallery">
            <div class="app-header">
                <button class="close-btn">〈 뒤로</button>
                <h2>사진첩</h2>
            </div>
            <!-- 사진첩 전용 클래스(gallery-grid) 추가 -->
            <div class="app-content gallery-grid">
                <img src="https://picsum.photos/seed/1/200/200" alt="사진1">
                <img src="https://picsum.photos/seed/2/200/200" alt="사진2">
                <img src="https://picsum.photos/seed/3/200/200" alt="사진3">
                <img src="https://picsum.photos/seed/4/200/200" alt="사진4">
                <img src="https://picsum.photos/seed/5/200/200" alt="사진5">
                <img src="https://picsum.photos/seed/6/200/200" alt="사진6">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
