<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🔒 컴퓨터 로그인/잠금화면 -->
    <div class="login-screen" id="loginScreen">
        <div class="login-profile">
            <img src="https://picsum.photos/seed/userprofile/150/150" alt="프로필">
            <h2>System Admin</h2>
        </div>
        <div class="unlock-area" id="unlockBtn">
            <span>문 따고 들어가기</span>
        </div>
    </div>

    <!-- 💻 바탕화면 영역 -->
    <div class="desktop-environment">
        <!-- 바탕화면 아이콘들 -->
        <div class="desktop-icons">
            <!-- 데이지 기록 파일 -->
            <div class="desktop-icon" data-target="window-daisy">
                <img src="https://picsum.photos/seed/folder1/80/80" alt="Folder">
                <span>데이지_관찰기록.txt</span>
            </div>
            
            <!-- 사진첩 폴더 -->
            <div class="desktop-icon" data-target="window-gallery">
                <img src="https://picsum.photos/seed/folder2/80/80" alt="Folder">
                <span>공용_사진첩</span>
            </div>

            <!-- 메신저 (연인) -->
            <div class="desktop-icon" data-target="window-chat">
                <img src="https://picsum.photos/seed/messenger/80/80" alt="Messenger">
                <span>Secure_Chat</span>
            </div>
        </div>

        <!-- 하단 작업표시줄 -->
        <div class="taskbar">
            <div class="start-btn">⊞ 시작</div>
            <div class="taskbar-time" id="desktopClock">00:00</div>
        </div>
    </div>

    <!-- 🗔 윈도우 창 1: 데이지 기록 -->
    <div class="window" id="window-daisy">
        <div class="window-header">
            <span class="window-title">메모장 - 데이지_관찰기록.txt</span>
            <button class="window-close">X</button>
        </div>
        <div class="window-content">
            [관찰 및 동향 보고]<br><br>
            - 현재까지 연애 기류는 전혀 없음.<br>
            - 철저히 비즈니스적이고 사무적인 태도를 유지 중임.<br>
            - 추가적인 특이사항 발견 시 즉시 업데이트 요망.
        </div>
    </div>

    <!-- 🗔 윈도우 창 2: 사진첩 -->
    <div class="window" id="window-gallery">
        <div class="window-header">
            <span class="window-title">이미지 뷰어 - 공용_사진첩</span>
            <button class="window-close">X</button>
        </div>
        <div class="window-content gallery-grid">
            <img src="https://picsum.photos/seed/11/300/200" alt="사진1">
            <img src="https://picsum.photos/seed/12/300/200" alt="사진2">
            <img src="https://picsum.photos/seed/13/300/200" alt="사진3">
            <img src="https://picsum.photos/seed/14/300/200" alt="사진4">
        </div>
    </div>

    <!-- 🗔 윈도우 창 3: 메신저 (연인) -->
    <div class="window" id="window-chat">
        <div class="window-header">
            <span class="window-title">Secure_Chat - ❤️</span>
            <button class="window-close">X</button>
        </div>
        <div class="window-content chat-content">
            <div class="chat-message lover">
                <strong>❤️</strong><br>
                어제 무사히 들어갔어? 피곤하지는 않고?
            </div>
            <div class="chat-message me">
                <strong>나</strong><br>
                응, 방금 파일 정리하는 중이야.
            </div>
            <div class="chat-message lover">
                <strong>❤️</strong><br>
                다행이다. 일찍 쉬어! 이따 저녁에 봐.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
